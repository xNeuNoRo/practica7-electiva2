services:
  app:
    image: oven/bun:1.4.3
    working_dir: /app
    volumes:
      - ./src:/app:ro
    command: ["bun", "run", "app.ts"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://practica:practica123@db:3306/practica
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:9.7.2
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: practica
      MYSQL_USER: practica
      MYSQL_PASSWORD: practica123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
